<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>JN Foto — Jornal do Natal</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#16488c,#06132e 65%);color:white;font:16px system-ui,sans-serif;text-align:center;min-height:100dvh}main{max-width:460px;margin:auto;padding:14px 16px 24px}h1{font-size:25px;color:#ffda79;margin:4px}p{margin:6px 0 12px}small{color:#c7d6ee}.stage{position:relative;aspect-ratio:9/16;width:min(100%, 48dvh);margin:12px auto;background:#12233e;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px #d8aa50}.stage video,.stage canvas,.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.stage img{pointer-events:none}.stage canvas{z-index:2}.hint{position:absolute;inset:35% 12%;color:#dbe7ff}.count{position:absolute;inset:40% 0;z-index:4;font-size:70px;font-weight:bold;text-shadow:0 2px 12px black;pointer-events:none}.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}button,select,.upload{font:inherit;border:1px solid #637ca8;border-radius:12px;padding:11px 14px;background:#15366b;color:white;cursor:pointer;min-height:44px}button.primary{background:#ffcf60;color:#11234b;font-weight:800;border:0}button:disabled{opacity:.45;cursor:default}[hidden]{display:none!important}#status{min-height:22px;font-size:14px;color:#ffe1a0}footer{font-size:12px;color:#c7d6ee;margin-top:14px}</style></head><body><main><h1>JN Foto</h1><small>JORNAL DO NATAL · COMUNIDADE CRISTO</small><p>Sua foto faz parte dessa notícia!</p><div class="stage"><div class="hint" id="hint">Ative a câmera ou escolha uma foto da galeria.</div><video id="video" autoplay muted playsinline hidden></video><img id="frame" src="moldura.png" alt="Moldura oficial do Jornal do Natal"><canvas id="photo" width="1080" height="1920" hidden></canvas><div class="count" id="count" aria-live="polite"></div></div><div id="live" class="controls"><button id="start" class="primary">Ativar câmera</button><button id="snap" class="primary" hidden>Tirar foto</button><button id="flip" hidden>Alternar câmera</button><label class="upload">Galeria<input id="file" type="file" accept="image/*" hidden></label><select id="timer" aria-label="Temporizador"><option value="0">Sem timer</option><option value="3">3 segundos</option><option value="5">5 segundos</option><option value="10">10 segundos</option></select></div><div id="result" class="controls" hidden><button id="save" class="primary">Salvar foto</button><button id="share">Compartilhar</button><button id="again">Outra foto</button></div><p id="status" role="status"></p><footer>As fotos são processadas no seu aparelho. Nenhuma imagem é enviada a um servidor.</footer></main><script>
const $=id=>document.getElementById(id),v=$('video'),c=$('photo'),ctx=c.getContext('2d'),frame=$('frame');let stream=null,facing='user',busy=false,blob=null,session=0;const status=t=>$('status').textContent=t;function stop(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;v.srcObject=null;}function live(){c.hidden=true;$('result').hidden=true;$('live').hidden=false;$('hint').hidden=!!stream;v.hidden=!stream;$('snap').hidden=!stream;$('flip').hidden=!stream;$('start').hidden=!!stream;blob=null;}async function camera(){if(busy)return;busy=true;const token=++session;stop();live();status('Solicitando acesso à câmera…');try{if(!navigator.mediaDevices?.getUserMedia)throw Error('HTTPS necessário');const s=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}}});if(token!==session){s.getTracks().forEach(t=>t.stop());return;}stream=s;v.srcObject=s;v.style.transform=facing==='user'?'scaleX(-1)':'';await v.play();live();status('');}catch(e){stop();live();status('Não foi possível abrir a câmera. Verifique a permissão, use HTTPS ou escolha uma foto da galeria.');}finally{busy=false;}}function draw(src,w,h,mirror){const scale=Math.max(c.width/w,c.height/h),dw=w*scale,dh=h*scale;ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height);ctx.save();if(mirror){ctx.translate(c.width,0);ctx.scale(-1,1);}ctx.drawImage(src,(c.width-dw)/2,(c.height-dh)/2,dw,dh);ctx.restore();ctx.drawImage(frame,0,0,c.width,c.height);}async function finish(src,w,h,mirror){if(!frame.complete||!frame.naturalWidth)throw Error('Moldura indisponível');draw(src,w,h,mirror);blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.95));if(!blob)throw Error('Falha ao criar foto');stop();v.hidden=true;c.hidden=false;$('hint').hidden=true;$('live').hidden=true;$('result').hidden=false;status('Foto pronta! Salve ou compartilhe nos Stories.');}const wait=ms=>new Promise(r=>setTimeout(r,ms));$('start').onclick=camera;$('flip').onclick=()=>{if(busy)return;facing=facing==='user'?'environment':'user';camera();};$('snap').onclick=async()=>{if(busy||!stream)return;busy=true;try{for(let n=Number($('timer').value);n>0;n--){$('count').textContent=n;await wait(1000);}$('count').textContent='';if(!v.videoWidth)throw Error();await finish(v,v.videoWidth,v.videoHeight,facing==='user');}catch(e){status('Não foi possível tirar a foto. Tente novamente.');}finally{busy=false;}};$('file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||busy)return;busy=true;const url=URL.createObjectURL(f);try{const im=new Image();im.src=url;await im.decode();await finish(im,im.naturalWidth,im.naturalHeight,false);}catch(e){status('Não foi possível abrir essa imagem. Tente uma foto JPG ou PNG.');}finally{URL.revokeObjectURL(url);busy=false;}};function save(){if(!blob)return;const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='JN-Foto-'+Date.now()+'.jpg';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);}$('save').onclick=save;$('share').onclick=async()=>{if(!blob)return;const f=new File([blob],'JN-Foto.jpg',{type:'image/jpeg'});try{if(navigator.canShare?.({files:[f]})){await navigator.share({files:[f]});}else{save();status('Foto salva. Abra o Instagram e selecione a imagem na galeria.');}}catch(e){if(e.name!=='AbortError')status('Compartilhamento indisponível. Use Salvar foto.');}};$('again').onclick=()=>{live();status('Escolha a câmera ou a galeria.');};window.addEventListener('pagehide',()=>{session++;stop();});frame.onerror=()=>status('Erro ao carregar a moldura. Recarregue a página.');
</script></body></html>
